<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات | التوفيق</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-layout"><aside class="sidebar"><div class="side-brand"><b>التوفيق</b><small>إدارة المتجر</small></div><a href="index.html">نظرة عامة</a><a class="selected" href="products.html">المنتجات</a><a href="orders.html">الطلبات</a><a href="scanner.html">ماسح الباركود</a><a href="banners.html">واجهة المتجر</a><button id="logout" class="logout">تسجيل الخروج</button></aside><main class="admin-main"><header class="admin-top"><div><small>إدارة الكتالوج</small><h1>المنتجات</h1></div><a class="btn" href="../index.html">عرض المتجر</a></header><section class="panel"><h2 id="formTitle">إضافة منتج جديد</h2><form id="productForm" class="admin-form"><input type="hidden" id="productId"><label>اسم المنتج<input id="name" required></label><label>القسم<select id="category"><option>الإلكترونيات</option><option>الملابس والأزياء</option><option>المنزل والمطبخ</option><option>الجمال والعناية</option><option>الرياضة واللياقة</option><option>أخرى</option></select></label><label>السعر بالأوقية<input id="price" type="number" min="0" required></label><label>الكمية<input id="stock" type="number" min="0" value="0"></label><label>الباركود<input id="barcode"></label><label>رابط صورة المنتج<input id="image_url" type="url" placeholder="https://..."></label><label class="check"><input id="is_active" type="checkbox" checked> نشر المنتج في المتجر</label><button class="btn">حفظ المنتج</button><button type="button" class="btn secondary" id="reset">إلغاء التعديل</button><div id="message" class="message"></div></form></section><section class="panel"><h2>قائمة المنتجات</h2><div class="table-wrap"><table><thead><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>الم

<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>لوحة التحكم | التوفيق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0c10; --surface: #1a151a; --primary: #d92343; --text: #fdfbfc; --border: #2e242b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        
        /* Login */
        .login-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 999; }
        .login-box { background: var(--surface); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; }
        .login-box h1 { margin-bottom: 20px; color: var(--primary); text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 12px; background: #241c22; border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { opacity: 0.9; }

        /* Layout */
        .sidebar { width: 250px; background: var(--surface); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--primary); margin-bottom: 30px; }
        .nav-link { padding: 12px 15px; color: #ccc; cursor: pointer; border-radius: 8px; margin-bottom: 5px; font-weight: bold; }
        .nav-link.active, .nav-link:hover { background: rgba(217, 35, 67, 0.1); color: var(--primary); }
        
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .section { display: none; }
        .section.active { display: block; }

        /* Tables & Forms */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); }
        th { color: var(--primary); }
        .table-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: white; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .upload-box { border: 2px dashed var(--border); padding: 15px; text-align: center; border-radius: 8px; position: relative; cursor: pointer; }
        .upload-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
        
        /* Mobile */
        .menu-btn { display: none; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; position: fixed; top: 10px; right: 10px; z-index: 10; }
        @media(max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; display: none; padding-top: 60px; }
            .sidebar.open { display: flex; }
            .menu-btn { display: block; }
            .main { padding: 60px 15px 15px; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>إدارة التوفيق</h1>
            <div class="form-group"><input type="email" id="email" class="form-control" placeholder="البريد الإلكتروني"></div>
            <div class="form-group"><input type="password" id="password" class="form-control" placeholder="كلمة المرور"></div>
            <button class="btn" onclick="login()">دخول</button>
            <p id="loginErr" style="color:red; text-align:center; margin-top:10px;"></p>
        </div>
    </div>

    <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

    <div class="sidebar" id="sidebar">
        <h2>التوفيق</h2>
        <div class="nav-link active" onclick="nav('dash', this)">📊 نظرة عامة</div>
        <div class="nav-link" onclick="nav('orders', this)">📦 الطلبات</div>
        <div class="nav-link" onclick="nav('products', this)">🛍️ المنتجات</div>
        <button class="btn" style="margin-top:auto; background:#333;" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="main">
        <!-- Dashboard -->
        <div id="dash" class="section active">
            <h2 style="margin-bottom:20px;">نظرة عامة</h2>
            <div class="grid-2" style="margin-bottom:20px;">
                <div class="card"><h3>إجمالي المبيعات</h3><h1 id="statSales" style="color:var(--primary);">0</h1></div>
                <div class="card"><h3>طلبات جديدة</h3><h1 id="statNewOrders">0</h1></div>
            </div>
            <div class="card">
                <h3>أحدث الطلبات</h3>
                <table><thead><tr><th>العميل</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody id="dashOrders"></tbody></table>
            </div>
        </div>

        <!-- Orders -->
        <div id="orders" class="section">
            <h2 style="margin-bottom:20px;">إدارة الطلبات</h2>
            <div class="card">
                <table><thead><tr><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="ordersTable"></tbody></table>
            </div>
        </div>

        <!-- Products -->
        <div id="products" class="section">
            <h2 style="margin-bottom:20px;">إدارة المنتجات</h2>
            
            <div class="card">
                <h3 id="formTitle">إضافة منتج جديد</h3>
                <form id="productForm" style="margin-top:15px;">
                    <input type="hidden" id="pId">
                    <div class="grid-2">
                        <div class="form-group"><label>الاسم</label><input type="text" id="pName" class="form-control" required></div>
                        <div class="form-group"><label>القسم</label>
                            <select id="pCat" class="form-control">
                                <option>الإلكترونيات</option><option>المنزل</option><option>الجمال</option><option>الملابس</option><option>أخرى</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group"><label>السعر</label><input type="number" id="pPrice" class="form-control" required></div>
                        <div class="form-group"><label>الكمية</label><input type="number" id="pStock" class="form-control" required></div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>الباركود</label>
                            <div style="display:flex; gap:5px;">
                                <input type="text" id="pBarcode" class="form-control">
                                <button type="button" class="btn" style="width:60px;" onclick="startScan()">📷</button>
                            </div>
                        </div>
                        <div class="form-group"><label>النشر</label>
                            <select id="pActive" class="form-control"><option value="true">نعم</option><option value="false">لا</option></select>
                        </div>
                    </div>
                    
                    <div id="reader" style="display:none; margin-bottom:15px; border-radius:10px; overflow:hidden;"></div>

                    <div class="form-group">
                        <label>الصور (حدد عدة صور)</label>
                        <div class="upload-box">
                            <input type="file" id="pImages" accept="image/*" multiple onchange="preview(this)">
                            <span>📸 اضغط لاختيار الصور</span>
                        </div>
                        <div id="previews" style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;"></div>
                    </div>
                    
                    <button type="submit" class="btn" style="width:150px;">حفظ المنتج</button>
                    <button type="button" class="btn" style="width:100px; background:#444;" onclick="resetForm()">إلغاء</button>
                    <p id="pMsg" style="margin-top:10px; font-size:14px;"></p>
                </form>
            </div>

            <div class="card">
                <table><thead><tr><th>الصورة</th><th>الاسم</th><th>السعر</th><th>الكمية</th><th>إجراء</th></tr></thead><tbody id="productsTable"></tbody></table>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const db = window.supabaseClient;
        let allProducts = [];
        let html5QrCode = null;

        // Auth
        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                const { data } = await db.from('profiles').select('role').eq('id', session.user.id).single();
                if (data?.role === 'admin') {
                    document.getElementById('loginScreen').style.display = 'none';
                    loadDash();
                    return;
                }
            }
            document.getElementById('loginScreen').style.display = 'flex';
        }

        async function login() {
            const { data, error } = await db.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
            if (error) return document.getElementById('loginErr').innerText = "خطأ في البيانات";
            const { data: p } = await db.from('profiles').select('role').eq('id', data.user.id).single();
            if (p?.role !== 'admin') { await db.auth.signOut(); return document.getElementById('loginErr').innerText = "ليس لديك صلاحية"; }
            location.reload();
        }

        async function logout() { await db.auth.signOut(); location.reload(); }

        function nav(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
            
            if(id === 'dash') loadDash();
            if(id === 'orders') loadOrders();
            if(id === 'products') loadProducts();
        }

        const money = n => new Intl.NumberFormat("ar-MR").format(n) + " أوقية";

        // Dashboard
        async function loadDash() {
            const { data: orders } = await db.from('orders').select('*').order('created_at', {ascending: false});
            if(orders) {
                document.getElementById('statSales').innerText = money(orders.reduce((a, b) => a + Number(b.total), 0));
                document.getElementById('statNewOrders').innerText = orders.filter(o => o.status === 'new').length;
                document.getElementById('dashOrders').innerHTML = orders.slice(0,5).map(o => `<tr><td>${o.customer_name}</td><td>${money(o.total)}</td><td>${o.status}</td></tr>`).join('');
            }
        }

        // Orders
        async function loadOrders() {
            const { data } = await db.from('orders').select('*').order('created_at', {ascending: false});
            document.getElementById('ordersTable').innerHTML = (data || []).map(o => `
                <tr>
                    <td>${new Date(o.created_at).toLocaleDateString('ar')}</td>
                    <td>${o.customer_name}</td>
                    <td>${o.phone}</td>
                    <td>${money(o.total)}</td>
                    <td>
                        <select class="form-control" style="padding:5px; width:100px;" onchange="updateStatus('${o.id}', this.value)">
                            <option value="new" ${o.status==='new'?'selected':''}>جديد</option>
                            <option value="processing" ${o.status==='processing'?'selected':''}>تجهيز</option>
                            <option value="completed" ${o.status==='completed'?'selected':''}>مكتمل</option>
                            <option value="cancelled" ${o.status==='cancelled'?'selected':''}>ملغي</option>
                        </select>
                    </td>
                    <td><button class="btn" style="padding:5px; font-size:12px;" onclick="viewOrder('${o.id}')">عرض</button></td>
                </tr>
            `).join('');
        }

        async function updateStatus(id, status) {
            await db.from('orders').update({ status }).eq('id', id);
            loadDash();
        }

        async function viewOrder(id) {
            const { data: order } = await db.from('orders').select('*').eq('id', id).single();
            const { data: items } = await db.from('order_items').select('*').eq('order_id', id);
            let str = `العميل: ${order.customer_name}\nالهاتف: ${order.phone}\nالعنوان: ${order.city} - ${order.address}\n\nالمنتجات:\n`;
            items?.forEach(i => str += `- ${i.product_name} (x${i.quantity}) = ${money(i.unit_price * i.quantity)}\n`);
            alert(str);
        }

        // Products
        async function loadProducts() {
            const { data } = await db.from('products').select('*').order('created_at', {ascending: false});
            allProducts = data || [];
            document.getElementById('productsTable').innerHTML = allProducts.map(p => `
                <tr>
                    <td><img src="${p.image_urls?.[0] || ''}" class="table-img"></td>
                    <td>${p.name}</td>
                    <td>${money(p.price)}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button class="btn" style="padding:4px; font-size:11px; width:auto;" onclick="edit('${p.id}')">تعديل</button>
                        <button class="btn" style="padding:4px; font-size:11px; width:auto; background:red;" onclick="del('${p.id}')">حذف</button>
                    </td>
                </tr>
            `).join('');
        }

        function preview(e) {
            document.getElementById('previews').innerHTML = '';
            Array.from(e.target.files).forEach(f => {
                const r = new FileReader();
                r.onload = ev => {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.style.cssText = 'width:50px; height:50px; object-fit:cover; border-radius:5px;';
                    document.getElementById('previews').appendChild(img);
                };
                r.readAsDataURL(f);
            });
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('pId').value = '';
            document.getElementById('formTitle').innerText = 'إضافة منتج جديد';
            document.getElementById('previews').innerHTML = '';
            document.getElementById('pMsg').innerText = '';
        }

        function edit(id) {
            const p = allProducts.find(x => x.id === id);
            if(!p) return;
            document.getElementById('pId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pCat').value = p.category;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pStock').value = p.stock;
            document.getElementById('pBarcode').value = p.barcode || '';
            document.getElementById('pActive').value = p.is_active.toString();
            document.getElementById('formTitle').innerText = 'تعديل المنتج';
            window.scrollTo(0,0);
        }

        async function del(id) {
            if(confirm('تأكيد الحذف؟')) {
                await db.from('products').delete().eq('id', id);
                loadProducts();
            }
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = 'جارٍ الحفظ...'; btn.disabled = true;
            const msg = document.getElementById('pMsg'); msg.innerText = '';

            const id = document.getElementById('pId').value;
            const files = document.getElementById('pImages').files;
            let urls = [];

            if (files.length > 0) {
                msg.innerText = 'جارٍ رفع الصور...';
                for(let i=0; i<files.length; i++) {
                    const name = `${Date.now()}_${i}.${files[i].name.split('.').pop()}`;
                    const { error } = await db.storage.from('product-images').upload(name, files[i]);
                    if(!error) urls.push(db.storage.from('product-images').getPublicUrl(name).data.publicUrl);
                }
            }

            if (id && urls.length === 0) {
                const old = allProducts.find(x => x.id === id);
                if(old) urls = old.image_urls || [];
            }

            const payload = {
                name: document.getElementById('pName').value,
                category: document.getElementById('pCat').value,
                price: Number(document.getElementById('pPrice').value),
                stock: Number(document.getElementById('pStock').value),
                barcode: document.getElementById('pBarcode').value || null,
                is_active: document.getElementById('pActive').value === 'true',
                image_urls: urls
            };

            const res = id ? await db.from('products').update(payload).eq('id', id) : await db.from('products').insert(payload);

            if(res.error) {
                msg.innerText = 'خطأ: ' + res.error.message;
                msg.style.color = 'red';
            } else {
                msg.innerText = 'تم الحفظ بنجاح!';
                msg.style.color = 'lightgreen';
                resetForm();
                loadProducts();
            }
            btn.innerText = 'حفظ المنتج'; btn.disabled = false;
        };

        // Scanner
        async function startScan() {
            const div = document.getElementById('reader');
            if(div.style.display === 'block') {
                if(html5QrCode) { await html5QrCode.stop(); html5QrCode = null; }
                div.style.display = 'none'; return;
            }
            div.style.display = 'block';
            if(!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                    document.getElementById('pBarcode').value = text;
                    html5QrCode.stop(); div.style.display = 'none';
                    alert("تم قراءة الباركود: " + text);
                }, () => {});
            } catch(e) { alert("تعذر تشغيل الكاميرا: " + e); div.style.display = 'none'; }
        }

        checkAuth();
    </script>
</body>
</html>

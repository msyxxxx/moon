<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>التوفيق | متجرك الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0c10; --surface: #1a151a; --surface-hover: #241c22;
            --primary: #d92343; --primary-hover: #f03b5c;
            --text-main: #fdfbfc; --text-muted: #a89da3;
            --border: #2e242b; --gold: #d4af37; --success: #25d366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text-main); font-family: "Cairo", sans-serif; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        
        /* Header */
        .announcement { height: 38px; background: linear-gradient(90deg, #8a0d25, #d92343); color: white; display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 11px; font-weight: 600; }
        .site-header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 20px; padding: 15px 5%; background: rgba(15, 12, 16, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { width: 45px; height: 45px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary), #8a0d25); border-radius: 12px; font-size: 24px; font-weight: 900; }
        .brand-text b { display: block; font-size: 22px; font-family: "Alexandria"; }
        .brand-text small { display: block; color: var(--text-muted); font-size: 10px; }
        .search-box { display: flex; flex: 1; max-width: 500px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .search-box input { background: none; border: 0; color: white; padding: 12px 18px; width: 100%; font-family: "Cairo"; outline: none; }
        .search-box button { width: 50px; border: 0; background: var(--primary); color: white; cursor: pointer; }
        .header-actions { margin-right: auto; }
        .cart-button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: white; padding: 10px 16px; cursor: pointer; font: 600 13px "Cairo"; }
        .cart-button b { background: var(--primary); border-radius: 20px; padding: 2px 8px; font-size: 11px; }

        /* Hero */
        .hero { position: relative; overflow: hidden; display: flex; align-items: center; padding: 80px 5%; background: radial-gradient(circle at 80% 50%, #3a111c 0%, var(--bg) 70%); min-height: 500px; }
        .hero-content { position: relative; z-index: 2; width: 55%; }
        .hero h1 { font-family: "Alexandria"; font-size: clamp(36px, 5vw, 56px); line-height: 1.2; margin-bottom: 20px; }
        .hero h1 em { font-style: normal; color: var(--primary); }
        .hero p { color: var(--text-muted); max-width: 450px; font-size: 15px; line-height: 1.8; margin-bottom: 30px; }
        .btn-primary { display: inline-flex; background: var(--primary); color: white; padding: 15px 30px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn-primary:hover { background: var(--primary-hover); }
        .hero-img-box { position: absolute; left: 5%; bottom: 0; width: 40%; height: 90%; display: flex; justify-content: center; align-items: flex-end; }
        .hero-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8)); }

        /* Products */
        .section { padding: 60px 5%; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .img-box { height: 220px; background: #fff; padding: 15px; display: flex; justify-content: center; align-items: center; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .info h3 { font-size: 15px; margin-bottom: 10px; }
        .price { font-size: 18px; color: var(--gold); font-weight: bold; margin-bottom: 15px; }
        .add-btn { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .add-btn:hover { background: var(--primary); color: white; }

        /* Cart */
        .cart-drawer { position: fixed; inset: 0 0 0 auto; width: min(400px, 100%); background: var(--surface); z-index: 200; transform: translateX(-100%); transition: 0.3s; padding: 25px; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .cart-drawer.open { transform: translateX(0); }
        .cart-head { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .cart-items { flex-grow: 1; overflow-y: auto; }
        .cart-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .cart-total { display: flex; justify-content: space-between; padding: 15px 0; font-weight: bold; color: var(--gold); }
        .checkout-form input, .checkout-form textarea { width: 100%; padding: 12px; margin-bottom: 10px; background: #241c22; border: 1px solid var(--border); color: white; border-radius: 8px; font-family: "Cairo"; }
        .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 150; display: none; }

        @media(max-width: 900px) {
            .hero { flex-direction: column; text-align: center; padding: 50px 5%; }
            .hero-content { width: 100%; margin-bottom: 30px; }
            .hero p { margin: 0 auto 20px; }
            .hero-img-box { position: relative; width: 100%; height: 300px; left: 0; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .img-box { height: 150px; }
            .info h3 { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="announcement"><span>🚚 توصيل سريع لجميع الولايات</span><span>|</span><span>💵 الدفع عند الاستلام</span></div>
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">ت</span>
            <div class="brand-text"><b>التوفيق</b><small>متجرك الشامل</small></div>
        </a>
        <form class="search-box" id="searchForm">
            <input id="searchInput" placeholder="ابحث عن منتج...">
            <button type="submit">🔍</button>
        </form>
        <div class="header-actions">
            <button class="cart-button" id="cartOpen"><span>🛒 السلة</span> <b id="cartCount">0</b></button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>اختيارك الذكي<br><em>يبدأ من هنا</em></h1>
                <p>مرحباً بكم في متجر التوفيق. نقدم لكم تشكيلة واسعة من أفضل المنتجات العالمية بجودة عالية وأسعار تنافسية.</p>
                <a class="btn-primary" href="#products">تسوق الآن ←</a>
            </div>
            <div class="hero-img-box"><img src="owner.jpg" alt="التوفيق"></div>
        </section>

        <section class="section" id="products">
            <h2 style="margin-bottom: 30px; font-family: 'Alexandria';">منتجاتنا المميزة</h2>
            <div class="product-grid" id="productGrid">
                <p style="text-align:center; grid-column:1/-1; color:#888;">جارٍ تحميل المنتجات...</p>
            </div>
        </section>
    </main>

    <div class="scrim" id="scrim"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-head"><h3>سلة التسوق</h3><button id="cartClose" style="background:none;border:none;color:white;cursor:pointer;">✖</button></div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-total"><span>الإجمالي:</span><span id="cartTotal">0 أوقية</span></div>
        <form class="checkout-form" id="checkoutForm">
            <input name="customer_name" placeholder="الاسم الكامل" required>
            <input name="phone" placeholder="رقم الهاتف" required>
            <input name="city" placeholder="المدينة" required>
            <textarea name="address" placeholder="العنوان التفصيلي"></textarea>
            <button class="btn-primary" style="width:100%; border:none; cursor:pointer;">تأكيد الطلب</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const db = window.supabaseClient;
        let globalProducts = [];
        let cart = JSON.parse(localStorage.getItem("taoufik_cart") || "[]");

        const money = n => new Intl.NumberFormat("ar-MR").format(n) + " أوقية";

        // تحميل المنتجات فقط من قاعدة البيانات
        async function loadProducts() {
            if (!db) return;
            const { data, error } = await db.from("products").select("*").eq("is_active", true).order("created_at", { ascending: false });
            if (!error && data) {
                globalProducts = data;
                renderProducts(globalProducts);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById("productGrid");
            if (products.length === 0) {
                grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#888;'>لا توجد منتجات حالياً.</p>";
                return;
            }
            grid.innerHTML = products.map(p => {
                const img = (p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/200?text=No+Image';
                return `
                <div class="product-card">
                    <div class="img-box"><img src="${img}" alt="${p.name}"></div>
                    <div class="info">
                        <div>
                            <span style="color:var(--text-muted); font-size:11px;">${p.category}</span>
                            <h3>${p.name}</h3>
                        </div>
                        <div>
                            <div class="price">${money(p.price)}</div>
                            <button class="add-btn" onclick="addToCart('${p.id}')">أضف إلى السلة</button>
                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        window.addToCart = (id) => {
            const p = globalProducts.find(x => x.id === id);
            if (!p) return;
            const item = cart.find(x => x.id === id);
            if (item) item.qty++;
            else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
            renderCart();
            event.target.innerText = "تمت الإضافة ✓";
            setTimeout(() => event.target.innerText = "أضف إلى السلة", 1000);
        };

        window.removeFromCart = (id) => {
            cart = cart.filter(x => x.id !== id);
            renderCart();
        };

        function renderCart() {
            document.getElementById("cartCount").innerText = cart.reduce((a, x) => a + x.qty, 0);
            document.getElementById("cartItems").innerHTML = cart.map(x => `
                <div class="cart-line">
                    <span>${x.name} × ${x.qty}</span>
                    <b>${money(x.price * x.qty)}</b>
                    <button onclick="removeFromCart('${x.id}')" style="background:none;border:none;color:red;cursor:pointer;">حذف</button>
                </div>
            `).join("") || "<p style='color:#888;text-align:center;'>السلة فارغة</p>";
            document.getElementById("cartTotal").innerText = money(cart.reduce((a, x) => a + x.price * x.qty, 0));
            localStorage.setItem("taoufik_cart", JSON.stringify(cart));
        }

        // التحكم بالسلة
        document.getElementById("cartOpen").onclick = () => { document.getElementById("cartDrawer").classList.add("open"); document.getElementById("scrim").style.display = "block"; };
        document.getElementById("cartClose").onclick = () => { document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("scrim").style.display = "none"; };
        document.getElementById("scrim").onclick = () => { document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("scrim").style.display = "none"; };

        // تأكيد الطلب
        document.getElementById("checkoutForm").onsubmit = async (e) => {
            e.preventDefault();
            if (!cart.length) return alert("السلة فارغة.");
            const btn = e.target.querySelector('button');
            btn.innerText = "جارٍ تأكيد الطلب..."; btn.disabled = true;

            const f = new FormData(e.target);
            const total = cart.reduce((a, x) => a + x.price * x.qty, 0);

            try {
                const { data: orderId, error } = await db.rpc('create_order', {
                    p_customer_name: f.get("customer_name"), p_phone: f.get("phone"),
                    p_city: f.get("city"), p_address: f.get("address") || "", p_total: total
                });
                if (error) throw error;

                const items = cart.map(x => ({ order_id: orderId, product_name: x.name, quantity: x.qty, unit_price: x.price }));
                await db.from("order_items").insert(items);

                cart = []; renderCart(); e.target.reset();
                alert("✅ تم استلام طلبك بنجاح! شكراً لثقتك.");
                document.getElementById("cartClose").click();
            } catch (err) {
                alert("❌ خطأ: " + err.message);
            } finally {
                btn.innerText = "تأكيد الطلب"; btn.disabled = false;
            }
        };

        renderCart();
        loadProducts();
    </script>
</body>
</html>

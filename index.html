<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOON 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2D2438;--purple:#B794D9;--purple-d:#8B5CB8;--purple-deep:#4A3570;--bg:#FAF5EE;--beige:#F0E6D6;--line:#EADFCC;--muted:#8B7E9E}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tajawal,sans-serif}
body{background:var(--bg);color:var(--ink);padding-bottom:40px}
button,input,select{font-family:inherit;outline:none}
header{position:sticky;top:0;z-index:60;background:rgba(45,36,56,.96);backdrop-filter:blur(12px);color:#fff;border-bottom:1px solid #3A2F4D}
.h{max-width:1320px;margin:auto;display:flex;gap:10px;align-items:center;padding:11px 14px}
.logo{font-weight:800;font-size:20px;color:#fff;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:6px}
.logo span{color:var(--purple)}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;padding:11px 16px;border-radius:999px;border:1px solid #4D3F63;background:#3A2F4D;color:#fff;font-size:14px}
.search input:focus{border-color:var(--purple)}
.search input::placeholder{color:#9C8DB0}
.actions{display:flex;gap:8px;align-items:center}
.ico{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1px solid #4D3F63;background:transparent;color:#fff;font-size:14px;text-decoration:none;font-weight:700;cursor:pointer}
.ico:hover{border-color:var(--purple);color:var(--purple)}
.ico b{background:var(--purple);color:#2D2438;border-radius:999px;padding:1px 7px;font-size:12px;min-width:20px;text-align:center}
.mob{display:inline-flex}.dsk{display:none}
.wrap{max-width:1320px;margin:0 auto;padding:18px 14px 60px;display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:1100px){.wrap{grid-template-columns:262px 1fr}.mob{display:none!important}.dsk{display:inline-flex}}
.filters{background:#fff;border-radius:18px;padding:18px;border:1px solid var(--line);height:fit-content}
@media(min-width:1100px){.filters{position:sticky;top:78px}}
@media(max-width:1099px){.filters{position:fixed;top:0;right:0;bottom:0;width:88%;max-width:350px;z-index:210;border-radius:0;overflow:auto;transform:translateX(110%);transition:transform .3s;box-shadow:-20px 0 50px rgba(74,53,112,.3)}.filters.open{transform:none}}
.fhead{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:14px}
.fblock{padding:14px 0;border-top:1px solid var(--line)}.fblock:first-of-type{border:none;padding-top:0}
.flabel{display:block;font-size:13px;font-weight:800;margin-bottom:9px;color:#4A3570}.flabel span{color:var(--purple-d)}
input[type=range]{width:100%;accent-color:var(--purple-d)}
.rd{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0;cursor:pointer;color:#333}
.rd input{accent-color:var(--purple-d);width:16px;height:16px;cursor:pointer}
.reset{width:100%;margin-top:12px;padding:11px;border-radius:12px;background:var(--beige);color:#4A3570;font-weight:800;font-size:13px;cursor:pointer;border:none}
.reset:hover{background:var(--ink);color:#fff}
.x{background:transparent;font-size:18px;color:#666;padding:4px 8px;border-radius:8px;border:none;cursor:pointer}
.hero{background:linear-gradient(135deg,#2D2438,#4A3570 55%,#3A2855);color:#fff;border-radius:24px;padding:32px 26px;position:relative;overflow:hidden;margin-bottom:18px}
.hero::before{content:'🌙';position:absolute;left:20px;bottom:-30px;font-size:180px;opacity:.08;line-height:1}
.hero h1{font-size:clamp(21px,3vw,32px);font-weight:800;line-height:1.4;position:relative}.hero h1 em{color:var(--purple);font-style:normal}
.hero p{color:#C9B8DB;margin-top:9px;font-size:14.5px;max-width:540px;line-height:1.6;position:relative}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted)}.count b{color:var(--ink);font-size:16px}
#sort{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:18px;padding:11px;border:1px solid var(--line);display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(74,53,112,.12);border-color:var(--purple)}
.thumb{aspect-ratio:1;border-radius:14px;background:linear-gradient(145deg,#F5EBDC,#E8D9C4);display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.pill{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--purple);color:#2D2438}
.pill.out{background:#FFE4E4;color:#C62828}.pill.off{background:var(--purple-deep);color:#fff}.pill.vid{background:rgba(45,36,56,.8);color:#fff;top:auto;bottom:8px;right:auto;left:8px;backdrop-filter:blur(4px)}
.pname{font-size:14px;font-weight:800;margin-top:9px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.pmeta .rate{color:#B794D9;font-weight:700}
.pdesc{font-size:11.5px;color:#9C8DB0;margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.prow{margin:8px 0 4px}
.price{font-size:16px;font-weight:800}.price s{font-size:11.5px;color:#C4B8D0;font-weight:500;margin-right:5px}
.add{margin-top:auto;background:var(--purple-deep);color:#fff;padding:11px;border-radius:12px;font-weight:800;font-size:13.5px;width:100%;cursor:pointer;border:none;transition:.2s}
.add:hover:not(:disabled){background:var(--purple);color:#2D2438}
.add:disabled{background:#EDE4F0;color:#B8A8C8;cursor:not-allowed}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}.empty p{margin-top:12px;font-size:15px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(45,36,56,.5);z-index:200;display:none}.scrim.show{display:block}
.drawer{position:fixed;inset:0;z-index:220;display:none}.drawer.open{display:block}
.ov{position:absolute;inset:0;background:rgba(45,36,56,.55)}
.pnl{position:absolute;top:0;bottom:0;left:0;background:#fff;width:94%;max-width:420px;display:flex;flex-direction:column;box-shadow:20px 0 60px rgba(74,53,112,.3)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-size:16px}
.dbody{flex:1;overflow:auto;padding:12px 18px}
.dfoot{border-top:1px solid var(--line);padding:14px 18px;background:#FAF5EE}
.totrow{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin-bottom:12px}.totrow b{color:var(--purple-d)}
#checkoutForm input,#checkoutForm textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:14px;background:#fff;color:var(--ink)}
#checkoutForm input:focus,#checkoutForm textarea:focus{border-color:var(--purple)}
.pay{width:100%;padding:13px;border-radius:12px;background:var(--purple-deep);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;border:none;display:block;text-align:center;text-decoration:none;transition:.2s}
.pay:hover:not(:disabled){background:var(--purple);color:#2D2438}
.pay:disabled{opacity:.6;cursor:wait}
.pay.wa{background:#25D366;color:#fff;margin-top:8px}.pay.ghost{background:var(--beige);color:#4A3570;margin-top:8px}
.citem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cthumb{width:56px;height:56px;border-radius:12px;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0}
.cthumb img{width:100%;height:100%;object-fit:cover}
.cinfo{flex:1;min-width:0}.cname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprice{font-size:12px;color:var(--muted);margin:3px 0 6px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:26px;height:26px;border-radius:8px;background:var(--beige);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--purple-deep)}
.qty button:hover{background:var(--purple-deep);color:#fff}
.qty span{font-size:13.5px;font-weight:800;min-width:18px;text-align:center}
.cdel{background:transparent;color:#C4B8D0;font-size:15px;padding:6px;border:none;cursor:pointer}
.cdel:hover{color:#EF4444}
.cempty{text-align:center;padding:60px 20px;color:var(--muted)}.cempty div{font-size:52px;margin-bottom:12px;opacity:.5}
.success{text-align:center;padding:20px 0}
.okicon{width:60px;height:60px;border-radius:50%;background:var(--purple);color:#2D2438;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.success h3{font-size:19px;margin-bottom:8px}.success p{font-size:13.5px;color:var(--muted);margin-bottom:4px}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:90vw}
.toast{background:var(--purple-deep);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:0 12px 34px rgba(74,53,112,.28)}
.toast.ok{background:#0e9f6e}.toast.err{background:#e02424}
</style></head><body>

<header><div class="h">
  <a class="logo" href="index.html">MOON <span>🌙</span></a>
  <div class="search"><input id="q" type="search" placeholder="ابحث عن سماعة، ساعة، حقيبة..." autocomplete="off"></div>
  <div class="actions">
    <button class="ico mob" id="btnFilter" title="فلترة">☰</button>
    <a class="ico" href="admin.html" title="لوحة التحكم">👤</a>
    <button class="ico" id="btnCart" title="السلة">🛒 <b id="cc">0</b></button>
  </div>
</div></header>

<div class="scrim" id="scrim" onclick="closeAll()"></div>

<div class="wrap">
  <aside class="filters" id="filters">
    <div class="fhead"><b>تصفية النتائج</b><button class="x mob" onclick="closeAll()">✕</button></div>
    <div class="fblock"><label class="flabel">السعر حتى <span id="pv">—</span></label><input type="range" id="pr" min="0" max="5000" step="50" value="5000"></div>
    <div class="fblock"><label class="flabel">الفئات</label><div id="cats"></div></div>
    <div class="fblock"><label class="flabel">التقييم</label>
      <label class="rd"><input type="radio" name="rt" value="0" checked> الكل</label>
      <label class="rd"><input type="radio" name="rt" value="4.5"> ★ 4.5 وأعلى</label>
      <label class="rd"><input type="radio" name="rt" value="4"> ★ 4.0 وأعلى</label>
    </div>
    <div class="fblock"><label class="rd"><input type="checkbox" id="inStock"> المتوفر فقط</label></div>
    <button class="reset" onclick="resetFilters()">إعادة ضبط</button>
  </aside>

  <main>
    <section class="hero">
      <h1>تسوّق <em>  هنا ضوء القمر</em></h1>
      <p>منتجات مختارة بعناية · توصيل سريع · دفع آمن عند الاستلام</p>
    </section>
    <div class="toolbar">
      <div class="count" id="count"></div>
      <select id="sort">
        <option value="default">الترتيب: الافتراضي</option>
        <option value="new">الأحدث</option>
        <option value="price-asc">السعر: الأقل أولاً</option>
        <option value="price-desc">السعر: الأعلى أولاً</option>
        <option value="rate">الأعلى تقييماً</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none"><div style="font-size:54px">🔍</div><p>لا توجد منتجات مطابقة</p></div>
  </main>
</div>

<div class="drawer" id="cartDrawer">
  <div class="ov" onclick="closeAll()"></div>
  <aside class="pnl">
    <div class="dhead"><b>سلة التسوق</b><button class="x" onclick="closeAll()">✕</button></div>
    <div class="dbody" id="cartItems"></div>
    <div class="dfoot">
      <div class="totrow"><span>المجموع</span><b id="tot">0</b></div>
      <div id="checkoutForm">
        <input id="cName" placeholder="الاسم الكامل">
        <input id="cPhone" placeholder="رقم الواتساب" inputmode="tel">
        <input id="cAddress" placeholder="العنوان (اختياري)">
        <textarea id="cNotes" placeholder="ملاحظات (اختياري)" rows="2"></textarea>
        <button class="pay" id="payBtn" onclick="checkout()">💳 إتمام الطلب</button>
      </div>
      <div id="successBox" style="display:none"></div>
    </div>
  </aside>
</div>

<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
let PRODUCTS = [], CART = [], SETTINGS = {};
const F = { q:'', max:5000, cats:[], rate:0, inStock:false, sort:'default' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('en-US') + ' ' + (SETTINGS.currency || 'أوقية');

function toast(msg, type) {
  const el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 2200);
}

async function boot() {
  try {
    SETTINGS = await ANEQ.settings.get();
    PRODUCTS = await ANEQ.products.list();
    CART = ANEQ.cart.get();
    const maxP = Math.max(1000, ...PRODUCTS.map(p => +p.price || 0));
    F.max = Math.ceil(maxP / 500) * 500;
    $('pr').max = F.max; $('pr').value = F.max; $('pv').textContent = money(F.max);
    buildCats(); bindEvents(); render(); renderCart();
    document.title = (SETTINGS.storeName || 'MOON 🌙');
    console.log(ANEQ.ONLINE ? '🟢 Supabase' : '🟡 local');
  } catch (e) { console.error(e); toast('تعذّر التحميل: ' + e.message, 'err'); }
}

function buildCats() {
  const cats = [...new Set(PRODUCTS.map(p => p.cat).filter(Boolean))];
  $('cats').innerHTML = cats.map(c => `<label class="rd"><input type="checkbox" class="cf" value="${esc(c)}"> ${esc(c)}</label>`).join('');
}

function bindEvents() {
  $('q').oninput = e => { F.q = e.target.value; render(); };
  $('pr').oninput = e => { F.max = +e.target.value; $('pv').textContent = money(F.max); render(); };
  $('cats').onchange = () => { F.cats = [...document.querySelectorAll('.cf:checked')].map(x => x.value); render(); };
  document.querySelectorAll('input[name=rt]').forEach(r => r.onchange = () => { F.rate = +document.querySelector('input[name=rt]:checked').value; render(); });
  $('inStock').onchange = e => { F.inStock = e.target.checked; render(); };
  $('sort').onchange = e => { F.sort = e.target.value; render(); };
  $('btnFilter').onclick = () => { $('filters').classList.add('open'); $('scrim').classList.add('show'); };
  $('btnCart').onclick = () => { $('cartDrawer').classList.add('open'); renderCart(); };
}

function closeAll() { $('filters').classList.remove('open'); $('scrim').classList.remove('show'); $('cartDrawer').classList.remove('open'); }

function resetFilters() {
  F.q = ''; F.rate = 0; F.cats = []; F.inStock = false; F.max = +$('pr').max;
  $('q').value = ''; $('pr').value = F.max; $('pv').textContent = money(F.max);
  document.querySelectorAll('.cf').forEach(c => c.checked = false);
  document.querySelector('input[name=rt][value="0"]').checked = true;
  $('inStock').checked = false; render();
}

function render() {
  const q = F.q.trim().toLowerCase();
  let list = PRODUCTS.filter(p => {
    if (q && !((p.name||'')+' '+(p.cat||'')+' '+(p.description||'')).toLowerCase().includes(q)) return false;
    if (+p.price > F.max) return false;
    if (F.cats.length && !F.cats.includes(p.cat)) return false;
    if (F.rate && (+p.rate || 0) < F.rate) return false;
    if (F.inStock && +p.stock <= 0) return false;
    return true;
  });
  switch (F.sort) {
    case 'price-asc': list.sort((a, b) => a.price - b.price); break;
    case 'price-desc': list.sort((a, b) => b.price - a.price); break;
    case 'rate': list.sort((a, b) => (b.rate||0) - (a.rate||0)); break;
    case 'new': list.sort((a, b) => b.id - a.id); break;
  }
  $('count').innerHTML = `<b>${list.length}</b> منتج متاح`;
  if (!list.length) { $('grid').innerHTML = ''; $('empty').style.display = 'block'; return; }
  $('empty').style.display = 'none';
  $('grid').innerHTML = list.map(cardHTML).join('');
}

function cardHTML(p) {
  const out = +p.stock <= 0;
  const off = p.old_price && +p.old_price > +p.price ? Math.round((1 - p.price / p.old_price) * 100) : 0;
  const firstImg = p.images && p.images.length ? p.images[0] : null;
  return `<article class="card">
    <div class="thumb">${firstImg ? `<img src="${esc(firstImg)}" loading="lazy">` : (p.emoji||'📦')}
      ${off ? `<span class="pill off">-${off}%</span>` : ''}
      ${out ? '<span class="pill out">نفد</span>' : (+p.stock <= 5 ? `<span class="pill">آخر ${p.stock}</span>` : '')}
      ${p.video_url ? '<span class="pill vid">▶ فيديو</span>' : ''}
    </div>
    <h3 class="pname">${esc(p.name)}</h3>
    <div class="pmeta"><span>${esc(p.cat||'')}</span><span class="rate">★ ${(+p.rate||0).toFixed(1)}</span></div>
    <p class="pdesc">${esc(p.description||'')}</p>
    <div class="prow"><div class="price">${money(p.price)}${off ? `<s>${money(p.old_price)}</s>` : ''}</div></div>
    <button class="add" ${out?'disabled':''} onclick="addToCart(${p.id})">${out?'غير متوفر':'أضف للسلة'}</button>
  </article>`;
}

function addToCart(id) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p || +p.stock <= 0) return toast('غير متوفر', 'err');
  const f = CART.find(x => x.id == id);
  if (f) { if (f.qty >= +p.stock) return toast('الكمية المتاحة: ' + p.stock, 'err'); f.qty++; }
  else CART.push({ id: p.id, name: p.name, price: +p.price, img: p.images?.[0], emoji: p.emoji, qty: 1 });
  ANEQ.cart.set(CART); renderCart(); toast('أُضيف للسلة ✓', 'ok');
}

function setQty(id, d) {
  const it = CART.find(x => x.id == id); if (!it) return;
  const p = PRODUCTS.find(x => x.id == id); const stock = p ? +p.stock : 99;
  const nq = it.qty + d;
  if (nq < 1) return removeItem(id);
  if (nq > stock) return toast('الكمية المتاحة: ' + stock, 'err');
  it.qty = nq; ANEQ.cart.set(CART); renderCart();
}
function removeItem(id) { CART = CART.filter(x => x.id != id); ANEQ.cart.set(CART); renderCart(); }

function renderCart() {
  $('cc').textContent = CART.reduce((s, i) => s + i.qty, 0);
  if (!CART.length) {
    $('cartItems').innerHTML = '<div class="cempty"><div>🛒</div><p>سلتك فارغة</p></div>';
    $('tot').textContent = money(0); $('checkoutForm').style.display = 'none'; return;
  }
  $('checkoutForm').style.display = 'block'; $('successBox').style.display = 'none';
  $('cartItems').innerHTML = CART.map(i => `
    <div class="citem">
      <div class="cthumb">${i.img ? `<img src="${esc(i.img)}">` : (i.emoji||'📦')}</div>
      <div class="cinfo">
        <div class="cname">${esc(i.name)}</div>
        <div class="cprice">${money(i.price)}</div>
        <div class="qty">
          <button onclick="setQty(${i.id},-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="setQty(${i.id},1)">+</button>
        </div>
      </div>
      <button class="cdel" onclick="removeItem(${i.id})">✕</button>
    </div>`).join('');
  $('tot').textContent = money(CART.reduce((s, i) => s + i.price * i.qty, 0));
}

async function checkout() {
  if (!CART.length) return toast('السلة فارغة', 'err');
  const name = $('cName').value.trim(), phone = $('cPhone').value.trim();
  const address = $('cAddress').value.trim(), notes = $('cNotes').value.trim();
  if (name.length < 2) return toast('أدخل اسمك', 'err');
  if (!/^[+\d][\d\s\-]{7,15}$/.test(phone)) return toast('رقم غير صحيح', 'err');
  const btn = $('payBtn'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';
  try {
    const order = await ANEQ.orders.create({ customer: name, phone, address, notes, items: CART.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })) });
    CART = []; ANEQ.cart.set(CART);
    PRODUCTS = await ANEQ.products.list();
    render(); renderCart(); showSuccess(order);
    $('cName').value = $('cPhone').value = $('cAddress').value = $('cNotes').value = '';
  } catch (e) { toast('خطأ: ' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '💳 إتمام الطلب'; }
}

function showSuccess(order) {
  $('checkoutForm').style.display = 'none';
  const box = $('successBox'); box.style.display = 'block';
  const num = String(order.id).slice(-6);
  const wa = (SETTINGS.whatsapp || '').replace(/\D/g, '');
  const msg = encodeURIComponent(`طلب #${num}\nالاسم: ${order.customer}\nالإجمالي: ${money(order.total)}`);
  box.innerHTML = `<div class="success">
    <div class="okicon">✓</div>
    <h3>تم استلام طلبك!</h3>
    <p>رقم الطلب: <b>#${num}</b></p>
    <p>سنتواصل معك قريبًا.</p>
    ${wa ? `<a class="pay wa" href="https://wa.me/${wa}?text=${msg}" target="_blank" rel="noopener">متابعة عبر واتساب</a>` : ''}
    <button class="pay ghost" onclick="closeAll();renderCart()">متابعة التسوق</button>
  </div>`;
}

boot();
</script>
</body></html>
